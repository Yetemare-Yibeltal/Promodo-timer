<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promodo - Advanced Focus Workspace</title>
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/utilities.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>Promodo</h1>
      <button id="themeToggle" class="icon-btn" aria-label="Toggle theme">🌙</button>
    </header>

    <main class="app-main">
      <section class="timer-card">
        <div class="mode-selector">
          <button class="mode-btn active" data-mode="work">Pomodoro</button>
          <button class="mode-btn" data-mode="shortBreak">Short Break</button>
          <button class="mode-btn" data-mode="longBreak">Long Break</button>
        </div>

        <div class="timer-circle-container">
          <svg width="260" height="260" viewBox="0 0 260 260">
            <circle cx="130" cy="130" r="110" stroke="var(--bg-tertiary)" stroke-width="12" fill="none" />
            <circle id="progressCircle" class="progress-ring__circle" cx="130" cy="130" r="110" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="691.15" stroke-dashoffset="0" />
          </svg>
          <div id="timeDisplay" class="timer-display-time">25:00</div>
        </div>

        <div class="timer-controls">
          <button id="startPauseBtn" class="btn-primary">Start</button>
          <button id="resetBtn" class="btn-secondary">Reset</button>
        </div>
      </section>

      <section class="tasks-card">
        <h2>Tasks</h2>
        <div class="task-input-container">
          <input type="text" id="taskInput" placeholder="What are you working on?" />
          <button id="addTaskBtn" class="btn-primary">Add</button>
        </div>
        <ul id="taskList"></ul>
      </section>
    </main>

    <footer class="app-footer">
      <p>&copy; 2026 Promodo Timer Workspace. Crafted for productivity.</p>
    </footer>
  </div>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
