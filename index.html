<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promodo - Advanced Focus Workspace</title>
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/tasks.css">
  <link rel="stylesheet" href="assets/css/analytics.css">
  <link rel="stylesheet" href="assets/css/settings.css">
  <link rel="stylesheet" href="assets/css/utilities.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>Promodo</h1>
      <div style="display: flex; gap: 0.5rem;">
        <button id="ambientBtn" class="icon-btn" title="Toggle White Noise">🔊</button>
        <button id="exportBtn" class="icon-btn" title="Export Data">💾</button>
        <button id="settingsToggle" class="icon-btn" title="Settings">⚙️</button>
        <button id="themeToggle" class="icon-btn" aria-label="Toggle theme">🌙</button>
      </div>
    </header>

    <main class="app-main">
      <section class="timer-card">
        <div class="mode-selector">
          <button class="mode-btn active" data-mode="work">Pomodoro</button>
          <button class="mode-btn" data-mode="shortBreak">Short Break</button>
          <button class="mode-btn" data-mode="longBreak">Long Break</button>
        </div>

        <div class="timer-circle-container">
          <svg width="260" height="260" viewBox="0 0 260 260">
            <circle cx="130" cy="130" r="110" stroke="var(--bg-tertiary)" stroke-width="12" fill="none" />
            <circle id="progressCircle" class="progress-ring__circle" cx="130" cy="130" r="110" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="691.15" stroke-dashoffset="0" />
          </svg>
          <div id="timeDisplay" class="timer-display-time">25:00</div>
        </div>

        <div class="timer-controls">
          <button id="startPauseBtn" class="btn-primary">Start</button>
          <button id="resetBtn" class="btn-secondary">Reset</button>
        </div>
      </section>

      <div>
        <section class="tasks-card">
          <h2>Tasks</h2>
          <div class="task-input-container">
            <input type="text" id="taskInput" placeholder="What are you working on?" />
            <button id="addTaskBtn" class="btn-primary">Add</button>
          </div>
          <ul id="taskList"></ul>
        </section>

        <section class="analytics-card">
          <h2>Weekly Summary</h2>
          <canvas id="analyticsChart" width="300" height="150" style="width: 100%; margin-top: 1rem;"></canvas>
        </section>
      </div>
    </main>

    <div id="settingsModal" class="modal-backdrop hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h3>Preferences</h3>
          <button id="closeSettings" class="icon-btn">✕</button>
        </div>
        <div class="form-group">
          <label for="workDurationInput">Pomodoro (minutes)</label>
          <input type="number" id="workDurationInput" value="25" min="1" max="120" />
        </div>
        <div class="form-group">
          <label for="shortBreakInput">Short Break (minutes)</label>
          <input type="number" id="shortBreakInput" value="5" min="1" max="60" />
        </div>
        <div class="form-group">
          <label for="longBreakInput">Long Break (minutes)</label>
          <input type="number" id="longBreakInput" value="15" min="1" max="90" />
        </div>
        <div class="modal-actions">
          <button id="saveSettingsBtn" class="btn-primary">Save Changes</button>
        </div>
      </div>
    </div>

    <footer class="app-footer">
      <div class="footer-content" style="display: flex; flex-direction: column; align-items: center; gap: 0.5rem;">
        <p>Built with <span style="color: #ef4444;">&hearts;</span> by Metages Yibeltal</p>
        <p class="text-muted" style="font-size: 0.8rem;">&copy; 2026 Promodo Timer. All rights reserved. Designed for optimal focus and personal productivity.</p>
      </div>
    </footer>
  </div>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
